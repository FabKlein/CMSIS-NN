#
# Coverage inventory based on Tests/UnitTest/run_float_unit_tests.py,
# Tests/UnitTest/cmsis/cmsis_nn_unit_tests_flt.csolution.yml, and
# generated and handwritten tests under Tests/UnitTest/TestCases/.
# Describes tests present in source, not execution results.
# Image tensor shapes use NHWC (batch, height, width, channels); spatial pairs use height x width.
# Matrix and transpose shapes retain their stated axis order. Fully connected inputs use
# height x width x channels, with batches listed separately.
schema_version: 1
scope: float_unit_tests
source_of_truth:
  runner: Tests/UnitTest/run_float_unit_tests.py
  cmsis_solution: Tests/UnitTest/cmsis/cmsis_nn_unit_tests_flt.csolution.yml
dtypes: [f32, f16]
target_types:
  host: ctest/cmake
  cmsis: Corstone-300-FVP
aliases:
  batchnorm: batch_norm
  bmm: batch_matmul
  bn: batch_norm
  concat: concatenation
  conv: convolve
  depthwise: depthwise_conv
  ds_cnn_s: ds_cnn_s_body
  dwconv: depthwise_conv
  fc: fully_connected
  lstm_unidirectional: lstm
  maximum: maximum_minimum
  minimum: maximum_minimum
  minmax: maximum_minimum
  tconv: transpose_conv
  transposeconv: transpose_conv
families:
  - name: activation
    generator_script: activation_settings_flt.py
    cmsis_project: test_arm_activation_flt
    coverage_summary: 1D activation sanity coverage for the float public activation API.
    coverage_cases:
      - Vector length 9 with mixed negative, zero, and positive values.
      - Covers sigmoid, tanh, hardswish, and leaky_relu with slope 0.125.
    dtypes:
      f32:
        host_target: test_arm_activation_f32
        cmsis_context: test_arm_activation_flt.F32+Corstone-300-FVP
        selectors:
          - activation_f32
        notes: generated offline by activation_settings_flt.py
      f16:
        host_target: test_arm_activation_f16
        cmsis_context: test_arm_activation_flt.F16+Corstone-300-FVP
        selectors:
          - activation_f16
        notes: generated offline by activation_settings_flt.py
  - name: avg_pool
    generator_script: pooling_settings_flt.py
    cmsis_project: test_arm_avg_pool_flt
    coverage_summary: NHWC average-pooling coverage across padding modes and activation clamp ranges.
    coverage_cases:
      - 1x12x22x20, filter 5x6, stride 5x9, SAME padding.
      - 1x5x9x3, filter 5x9, stride 2x1, VALID padding.
      - 1x3x3x1, filter 3x1, stride 1x1, SAME padding, activation clamp [0, 6].
    dtypes:
      f32:
        host_target: test_arm_avg_pool_f32
        cmsis_context: test_arm_avg_pool_flt.F32+Corstone-300-FVP
        selectors:
          - avgpool_f32
        notes: generated offline by pooling_settings_flt.py
      f16:
        host_target: test_arm_avg_pool_f16
        cmsis_context: test_arm_avg_pool_flt.F16+Corstone-300-FVP
        selectors:
          - avgpool_f16
        notes: generated offline by pooling_settings_flt.py
  - name: batch_matmul
    generator_script: batch_matmul_settings_flt.py
    cmsis_project: test_arm_batch_matmul_flt
    coverage_summary: Batched matrix multiplication coverage with broadcasted batch/height dimensions and transpose flags.
    coverage_cases:
      - lhs(2,2,8,5) x rhs(2,2,5,7), adj_x=0 adj_y=0.
      - lhs(2,2,8,5) x rhs(1,1,7,5), adj_x=0 adj_y=1.
      - lhs(1,1,5,8) x rhs(2,2,5,7), adj_x=1 adj_y=0.
      - lhs(2,1,5,8) x rhs(1,2,7,5), adj_x=1 adj_y=1.
      - lhs(1,2,8,5) x rhs(2,1,7,5), adj_x=0 adj_y=1 with tighter activation clamp [-1, 1].
    dtypes:
      f32:
        host_target: test_arm_batch_matmul_f32
        cmsis_context: test_arm_batch_matmul_flt.F32+Corstone-300-FVP
        selectors:
          - batch_matmul_f32_family
        notes: generated offline by batch_matmul_settings_flt.py
      f16:
        host_target: test_arm_batch_matmul_f16
        cmsis_context: test_arm_batch_matmul_flt.F16+Corstone-300-FVP
        selectors:
          - batch_matmul_f16_family
        notes: generated offline by batch_matmul_settings_flt.py
  - name: batch_norm
    generator_script: batch_norm_settings_flt.py
    cmsis_project: test_arm_batch_norm_flt
    coverage_summary: Float batch-normalization coverage in NHWC layout.
    coverage_cases:
      - NHWC case for shape 1x8x8x6.
      - NHWC case for shape 1x5x6x7.
    dtypes:
      f32:
        host_target: test_arm_batch_norm_f32
        cmsis_context: test_arm_batch_norm_flt.F32+Corstone-300-FVP
        selectors:
          - batch_norm_f32_family
        notes: generated offline by batch_norm_settings_flt.py
      f16:
