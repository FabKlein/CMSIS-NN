  - name: pad
    generator_script: pad_settings_flt.py
    cmsis_project: test_arm_pad_flt
    coverage_summary: NHWC pad coverage with asymmetric pre/post padding and constant fill values.
    coverage_cases:
      - 1x2x2x2 with pre=(0,0,1,1) and post=(0,0,2,2), pad_value=-3.0.
