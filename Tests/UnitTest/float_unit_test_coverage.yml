  - name: elementwise_mul
    generator_script: add_mul_settings_flt.py
    cmsis_project: test_arm_elementwise_mul_flt
    coverage_summary: Elementwise multiply coverage with full-vector and tail/spill lengths plus activation clamp.
    coverage_cases:
      - Block size 160 with activation clamp [-10, 10].
      - Spill case block size 245 with activation clamp [-1.5, 1.0].
    dtypes:
      f32:
        host_target: test_arm_elementwise_mul_f32
        cmsis_context: test_arm_elementwise_mul_flt.F32+Corstone-300-FVP
        selectors:
          - mul_f32_family
        notes: generated offline by add_mul_settings_flt.py
      f16:
        host_target: test_arm_elementwise_mul_f16
        cmsis_context: test_arm_elementwise_mul_flt.F16+Corstone-300-FVP
        selectors:
          - mul_f16_family
        notes: generated offline by add_mul_settings_flt.py
  - name: fully_connected
    generator_script: fully_connected_settings_flt.py
    cmsis_project: test_arm_fully_connected_flt
    coverage_summary: Fully connected coverage across small, medium, and larger flattened inputs, plus specialized 2-output cases with tail predication testing.
    coverage_cases:
      - Small: batches=1, input=8x8x1, output_c=16.
      - Medium: batches=1, input=16x16x1, output_c=32.
      - Large: batches=2, input=16x32x1, output_c=64.
      - 2-output aligned: batches=2, input=8x8x1, output_c=2 (tests FC 2-output optimization path).
      - 2-output tail17: batches=2, input=1x1x17, output_c=2 (tests tail predication with 1 remainder).
      - 2-output tail21: batches=2, input=1x1x21, output_c=2 (tests tail predication with 1/5 remainder for f32/f16).
      - Null bias: batches=2, input=1x1x33, output_c=5, no bias.
      - Activation clamp: batches=1, input=1x1x10, output_c=4, clamp [-0.7, 1.0].
    dtypes:
      f32:
        host_target: test_arm_fully_connected_f32
        cmsis_context: test_arm_fully_connected_flt.F32+Corstone-300-FVP
        selectors:
          - fully_connected_f32_family
        notes: generated offline by fully_connected_settings_flt.py
      f16:
        host_target: test_arm_fully_connected_f16
        cmsis_context: test_arm_fully_connected_flt.F16+Corstone-300-FVP
        selectors:
          - fully_connected_f16_family
        notes: generated offline by fully_connected_settings_flt.py
  - name: lstm
    generator_script: lstm_settings_flt.py
    cmsis_project: test_arm_lstm_unidirectional_flt
    coverage_summary: Unidirectional float LSTM coverage with increasing sequence and hidden sizes.
    coverage_cases:
      - Small: time_steps=5, batch=2, input_size=8, hidden_size=8.
      - Medium: time_steps=8, batch=3, input_size=12, hidden_size=16.
      - Large: time_steps=12, batch=4, input_size=16, hidden_size=24.
    dtypes:
      f32:
        host_target: test_arm_lstm_unidirectional_f32
        cmsis_context: test_arm_lstm_unidirectional_flt.F32+Corstone-300-FVP
        selectors:
          - lstm_f32_family
        notes: generated offline by lstm_settings_flt.py
      f16:
        host_target: test_arm_lstm_unidirectional_f16
        cmsis_context: test_arm_lstm_unidirectional_flt.F16+Corstone-300-FVP
        selectors:
          - lstm_f16_family
        notes: generated offline by lstm_settings_flt.py
  - name: max_pool
    generator_script: pooling_settings_flt.py
    cmsis_project: test_arm_max_pool_flt
    coverage_summary: NHWC max-pooling coverage including tail-channel and clamp-heavy cases.
    coverage_cases:
      - 2x12x22x8, filter 5x6, stride 5x9, SAME padding.
      - 1x5x9x3, filter 5x9, stride 2x1, VALID padding.
      - 1x5x1x17, filter 4x3, stride 3x1, SAME padding.
      - 1x2x4x1, filter 2x2, stride 2x2, VALID padding, activation clamp [0, 6].
    dtypes:
      f32:
        host_target: test_arm_max_pool_f32
