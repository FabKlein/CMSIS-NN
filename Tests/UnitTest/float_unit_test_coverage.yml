  - name: maximum_minimum
    generator_script: minmax_settings_flt.py
    cmsis_project: test_arm_maximum_minimum_flt
    coverage_summary: Broadcasting coverage for float maximum/minimum over common tensor alignment patterns.
    coverage_cases:
      - Scalar-to-tensor broadcast in both operand orders.
      - No-broadcast equal-shape case: 2x2x3x18.
      - Broadcast batch case: 2x1x6x21 with 1x1x6x21.
      - Broadcast height/width/channel cases including shapes with trailing singleton dimensions.
    dtypes:
      f32:
        host_target: test_arm_maximum_minimum_f32
        cmsis_context: test_arm_maximum_minimum_flt.F32+Corstone-300-FVP
