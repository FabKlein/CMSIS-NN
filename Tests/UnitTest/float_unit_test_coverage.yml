  - name: softmax
    generator_script: softmax_settings_flt.py
    cmsis_project: test_arm_softmax_flt
    coverage_summary: Small fixed-logit softmax sanity coverage.
    coverage_cases:
      - Two rows and five columns with hand-picked mixed-sign logits.
    dtypes:
      f32:
